<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Assistant | Knowledge Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">✦ AI Quiz</div>
            <p style="color: var(--text-muted);">Interactive Learning System</p>
        </header>

        <main id="quiz-container">
            <!-- Quiz Card (initially visible) -->
            <div class="quiz-card" id="question-card">
                <div class="progress-info" id="progress-text">Question 1 of 279</div>
                <div class="question-text" id="question-text">
                    Loading question...
                </div>
                <div class="options-container" id="options-container">
                    <!-- Options will be generated here -->
                </div>
                
                <div class="controls">
                    <button class="btn btn-primary" id="prev-btn" disabled>Previous</button>
                    <div id="feedback-text" style="font-weight: 600;"></div>
                    <button class="btn btn-primary" id="next-btn">Next</button>
                </div>
            </div>

            <!-- Completion State -->
            <div class="quiz-card hidden" id="completion-state">
                <h2 style="margin-bottom: 1rem;">Quiz Completed!</h2>
                <p id="score-text">You've reached the end of the question bank.</p>
                <button class="btn btn-primary" onclick="location.reload()" style="margin-top: 2rem;">Restart Quiz</button>
            </div>
        </main>
    </div>

    <script src="quiz.js"></script>
</body>
</html>
